name: dq-platform

# Hệ thống dev/test cô lập. Mọi giá trị bí mật nằm trong file dưới ${DQ_SECRETS_DIR}
# (scripts/run_acceptance.py sinh thư mục này). Không có token mặc định, không publish port cố định.
#   DQ_SECRETS_DIR=/abs/secrets docker compose -p <project> up -d --build postgres minio dq-service

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: spark/Dockerfile
    args:
      HADOOP_VERSION: ${HADOOP_VERSION:?HADOOP_VERSION là bắt buộc}
  image: dq-demo/spark-deequ:3.5.1
  environment:
    DQ_RUN_KEY: ${DQ_RUN_KEY:-}
  secrets: [minio_user, minio_password, job_token]
  volumes:
    - ./spark/jobs:/opt/dq/jobs:ro
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  networks: [dq]

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: dq
      POSTGRES_USER: dq
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/01-init.sh
    volumes:
      - ./postgres:/dq-sql:ro
      - pgdata:/var/lib/postgresql/data
      # init.sql dùng \ir migrations/...; psql chạy với -f từ /dq-sql
    ports: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq"]
      interval: 5s
      retries: 20
    networks: [dq]

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE (đã pin digest) là bắt buộc}
    entrypoint: ["sh", "-c", "MINIO_ROOT_USER=$$(cat /run/secrets/minio_user) MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_password) exec minio server /data"]
    secrets: [minio_user, minio_password]
    volumes:
      - miniodata:/data
    ports: ["9000"]
    networks: [dq]

  dq-service:
    build:
      context: .
      dockerfile: dq-service/Dockerfile
    image: dq-demo/dq-service:0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      DQ_TOKEN_REGISTRY_FILE: /run/secrets/token_registry.json
      DQ_ALERT_WEBHOOK_URL: ${DQ_ALERT_WEBHOOK_URL:-}
      DQ_RESTORE_MODE: ${DQ_RESTORE_MODE:-0}
    secrets: [database_url, token_registry.json]
    ports: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 20
    networks: [dq]

  dq-console-worker:
    build:
      context: .
      dockerfile: dq-service/Dockerfile
    image: dq-demo/dq-service:0.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      DQ_ALERT_WEBHOOK_URL: ${DQ_ALERT_WEBHOOK_URL:-}
    secrets: [database_url]
    command: ["python", "-m", "console_worker"]
    networks: [dq]

  frontend:
    profiles: [ui]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dq-demo/dq-platform-ui:0.1
    depends_on:
      dq-service:
        condition: service_healthy
    ports: ["8080"]
    networks: [dq]

  # Driver Spark chạy ad hoc: docker compose run --rm spark <spark-submit ...>
  spark:
    <<: *spark-common
    profiles: [jobs]
    entrypoint: ["/opt/dq/bin/with-s3-env.sh"]

configs:
  pg_init:
    content: |
      #!/bin/sh
      set -eu
      # được entrypoint postgres `source`: không exec, không đổi cwd của shell cha
      (cd /dq-sql && psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f init.sql)

secrets:
  postgres_password:
    file: ${DQ_SECRETS_DIR:?DQ_SECRETS_DIR là bắt buộc}/postgres_password
  minio_user:
    file: ${DQ_SECRETS_DIR}/minio_user
  minio_password:
    file: ${DQ_SECRETS_DIR}/minio_password
  database_url:
    file: ${DQ_SECRETS_DIR}/database_url
  token_registry.json:
    file: ${DQ_SECRETS_DIR}/token_registry.json
  job_token:
    file: ${DQ_SECRETS_DIR}/job_token

volumes:
  pgdata:
  miniodata:

networks:
  dq:
