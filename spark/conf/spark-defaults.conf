# ---------- Spark chung ----------
spark.master                                   local[2]
spark.ui.showConsoleProgress                   false
# Delta/S3A jars nằm sẵn trong /opt/spark/jars; spark.jars chỉ chứa jars DQ
spark.jars                                     /opt/dq/jars/dq-client-0.1.0.jar,/opt/dq/jars/dq-jobs-0.1.0.jar,/opt/dq/jars/deequ-2.0.21-spark-3.5.jar
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog

# ---------- Runtime profile dq-runtime-v1 (5 key, so khớp với compat manifest) ----------
spark.sql.session.timeZone                     UTC
spark.sql.ansi.enabled                         false
spark.sql.caseSensitive                        false
spark.sql.legacy.timeParserPolicy              EXCEPTION
spark.sql.sources.partitionOverwriteMode       static

# ---------- S3A / MinIO: credential lấy từ env AWS_* (with-s3-env.sh), không nằm trong conf ----------
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# ---------- Data quality (metadata không bí mật; token qua env DQ_API_TOKEN) ----------
spark.dq.service.url http://dq-service:8000
spark.dq.service.timeout.sec 10
spark.dq.purpose default
# spark.dq.dataset, spark.dq.compat.manifest.id, spark.dq.state.dir do launcher đặt theo run; env DQ_RUN_KEY, DQ_API_TOKEN
