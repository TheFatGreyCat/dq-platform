# MinIO dev trong cluster (production: S3/object store thật; chỉ đổi dq-runtime.s3_endpoint + Secret dq-s3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: dq-platform}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: dq-s3, key: access-key}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: dq-s3, key: secret-key}}
          ports: [{name: s3, containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 3
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
# Bucket dq-lake (Delta tables + _dq_state). mc có sẵn trong image MinIO; idempotent (--ignore-existing).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: mc
          image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
          command: ["sh", "-c"]
          args:
            - export MC_CONFIG_DIR=/tmp/mc;
              mc alias set dq http://minio:9000 "$AK" "$SK" >/dev/null &&
              mc mb --ignore-existing dq/dq-lake
          env:
            - name: AK
              valueFrom: {secretKeyRef: {name: dq-s3, key: access-key}}
            - name: SK
              valueFrom: {secretKeyRef: {name: dq-s3, key: secret-key}}
