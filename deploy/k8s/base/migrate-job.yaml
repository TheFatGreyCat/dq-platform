# Argo CD Sync hook: chạy trước khi Deployment được apply (sync-wave -1). Schema idempotent nên chạy mỗi sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: dq-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: dq-migrate, app.kubernetes.io/part-of: dq-platform}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: dq-platform/migrate
          imagePullPolicy: IfNotPresent
          env:
            - name: PSQL_URL
              valueFrom: {secretKeyRef: {name: dq-database, key: psql_url}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
