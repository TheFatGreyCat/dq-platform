<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">DQ Platform — Data plane and control plane</title>
<desc id="desc">A readable flowchart of the scheduler, Spark data plane, control plane, and Delta storage flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#27313b"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2878c8"/></marker>
  <style>
    text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#202833}
    .title{font-size:26px;font-weight:700;letter-spacing:.5px}
    .section{font-size:16px;font-weight:700;letter-spacing:.5px}
    .label{font-size:16px;font-weight:700}
    .small{font-size:13px}
    .tiny{font-size:12px;font-weight:600}
    .box{fill:#fffefa;stroke-width:2;stroke-linejoin:round}
    .wire{fill:none;stroke:#27313b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .wireBlue{fill:none;stroke:#2878c8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}
    .tag{fill:#fffefa;stroke:#d9dee5;stroke-width:1}
  </style>
</defs>
<rect width="1400" height="900" rx="18" fill="#f5f3f7"/>
<rect x="16" y="16" width="1368" height="868" rx="14" fill="#fffefa" stroke="#2878c8" stroke-width="2" stroke-dasharray="9 7"/>
<text x="700" y="58" text-anchor="middle" class="title">DQ PLATFORM — DATA PLANE &amp; CONTROL PLANE</text>

<!-- Scheduler -->
<rect x="54" y="103" width="172" height="86" rx="15" fill="#f8fbff" stroke="#2878c8" stroke-width="2"/>
<text x="140" y="143" text-anchor="middle" class="label">Scheduler</text>

<!-- Data plane -->
<rect x="54" y="222" width="824" height="274" rx="20" fill="#fbfefc" stroke="#188e8b" stroke-width="2"/>
<text x="466" y="250" text-anchor="middle" class="section" fill="#147d79">DATA PLANE · SPARK</text>
<rect x="102" y="303" width="204" height="82" rx="13" class="box" stroke="#188e8b"/>
<text x="204" y="338" text-anchor="middle" class="label">Job Python / Scala</text>
<text x="204" y="362" text-anchor="middle" class="small">dataset processing</text>
<rect x="377" y="303" width="224" height="82" rx="13" class="box" stroke="#188e8b"/>
<text x="489" y="338" text-anchor="middle" class="label">dq-client + Deequ</text>
<text x="489" y="362" text-anchor="middle" class="small">plan · checks · report</text>
<rect x="672" y="303" width="170" height="82" rx="13" class="box" stroke="#d58a29"/>
<text x="757" y="338" text-anchor="middle" class="label" fill="#a76916">DeltaPublisher</text>
<text x="757" y="362" text-anchor="middle" class="small">publish data</text>

<!-- Main compute flow -->
<path d="M140 189 V266 H204 V301" class="wireBlue"/>
<rect x="137" y="238" width="160" height="30" rx="8" class="tag"/>
<text x="217" y="259" text-anchor="middle" class="tiny" fill="#2878c8">run_dataset_job.py</text>
<path d="M306 344 H375" class="wire"/>
<path d="M601 344 H670" class="wire"/>

<!-- Control plane -->
<rect x="925" y="103" width="421" height="393" rx="20" fill="#fffdfd" stroke="#c9565d" stroke-width="2"/>
<text x="1135" y="132" text-anchor="middle" class="section" fill="#b3454d">CONTROL PLANE</text>
<rect x="1022" y="158" width="227" height="58" rx="12" class="box" stroke="#4c8d4a"/>
<text x="1135" y="194" text-anchor="middle" class="label" fill="#39733a">Registry bất biến</text>
<rect x="1022" y="245" width="227" height="58" rx="12" class="box" stroke="#c9565d"/>
<text x="1135" y="281" text-anchor="middle" class="label" fill="#b3454d">Gate · ALLOW / DENY</text>
<rect x="1022" y="332" width="227" height="62" rx="12" class="box" stroke="#7552b8"/>
<text x="1135" y="358" text-anchor="middle" class="label" fill="#6343a0">Outcome CAS</text>
<text x="1135" y="380" text-anchor="middle" class="small">+ publication</text>
<rect x="1022" y="421" width="227" height="48" rx="12" class="box" stroke="#7552b8"/>
<text x="1135" y="451" text-anchor="middle" class="small" font-weight="700">Anomaly worker · 127.0.0.1</text>
<path d="M1249 274 H1307 V445 H1251" class="wire"/>

<!-- Control-plane connections -->
<path d="M489 303 V275 H904 V196 H923" class="wireBlue"/>
<rect x="665" y="251" width="154" height="28" rx="8" class="tag"/>
<text x="742" y="270" text-anchor="middle" class="tiny" fill="#2878c8">plan · attempt · report</text>
<path d="M757 385 V407 H970 V363 H1020" class="wireBlue"/>
<rect x="827" y="393" width="122" height="27" rx="8" class="tag"/>
<text x="888" y="411" text-anchor="middle" class="tiny" fill="#2878c8">write-outcomes</text>

<!-- Delta lake -->
<rect x="54" y="548" width="1292" height="280" rx="20" fill="#fcfbff" stroke="#7552b8" stroke-width="2"/>
<text x="1100" y="579" text-anchor="middle" class="section" fill="#6343a0">DELTA LAKE · MINIO / S3</text>
<rect x="98" y="656" width="210" height="102" rx="15" class="box" stroke="#4c8d4a"/>
<text x="203" y="715" text-anchor="middle" class="label" fill="#39733a">Bronze</text>
<rect x="418" y="656" width="230" height="102" rx="15" class="box" stroke="#4c8d4a"/>
<text x="533" y="700" text-anchor="middle" class="label" fill="#39733a">Candidate</text>
<text x="533" y="726" text-anchor="middle" class="small">raw / classified</text>
<rect x="780" y="656" width="210" height="102" rx="15" class="box" stroke="#4c8d4a"/>
<text x="885" y="715" text-anchor="middle" class="label" fill="#39733a">Quarantine</text>
<rect x="1090" y="656" width="190" height="102" rx="15" class="box" stroke="#4c8d4a"/>
<text x="1185" y="715" text-anchor="middle" class="label" fill="#39733a">Silver</text>

<!-- Storage flow, deliberately routed in open lanes -->
<path d="M489 385 V526 H533 V654" class="wire"/>
<rect x="407" y="500" width="147" height="27" rx="8" class="tag"/>
<text x="480" y="519" text-anchor="middle" class="tiny">candidate output</text>
<path d="M203 654 V531 H204 V387" class="wire"/>
<rect x="111" y="510" width="126" height="27" rx="8" class="tag"/>
<text x="174" y="529" text-anchor="middle" class="tiny">read input</text>
<path d="M757 385 V514 H885 V654" class="wire"/>
<rect x="800" y="526" width="105" height="27" rx="8" class="tag"/>
<text x="852" y="545" text-anchor="middle" class="tiny">quarantine</text>
<path d="M875 630 Q885 608 895 630" fill="none" stroke="#fcfbff" stroke-width="8"/>
<path d="M680 385 V630 H875 Q885 608 895 630 H1185 V654" class="wire"/>
<rect x="1028" y="602" width="117" height="27" rx="8" class="tag"/>
<text x="1086" y="621" text-anchor="middle" class="tiny">Silver output</text>
<text x="700" y="797" text-anchor="middle" class="small" fill="#6343a0">Compute gần dữ liệu · control plane chỉ nhận metadata, measurement và quyết định</text>
</svg>